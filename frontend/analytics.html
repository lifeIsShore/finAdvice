<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Analytics</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .analytics-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .chart-card h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 15px;
        }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .metrics-table th,
        .metrics-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metrics-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: #a0aec0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            color: #ff6b6b;
        }

        canvas {
            max-height: 400px;
        }
    </style>
</head>

<body>
    <div class="analytics-container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Model Analytics - <span id="ticker-name">Loading...</span></h1>
            <a href="index.html" class="back-btn" id="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Loading diagnostics...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- Extended Metrics Table -->
            <div class="chart-card" style="grid-column: 1 / -1;">
                <h3><i class="fas fa-table"></i> Extended Model Metrics</h3>
                <table class="metrics-table" id="extended-metrics">
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th
                                data-tooltip="Precision: When the model predicts UP, how often is it correct? Higher is better.">
                                Precision</th>
                            <th
                                data-tooltip="Recall: How many of the actual UP movements did the model catch? Higher is better.">
                                Recall</th>
                            <th data-tooltip="F1-Score: A balance between Precision and Recall. Higher is better.">
                                F1-Score</th>
                            <th
                                data-tooltip="AUC: Overall ability of the model to distinguish between UP and DOWN. Higher is better.">
                                AUC</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="grid">
                <!-- ROC Curves -->
                <div class="chart-card">
                    <h3><i class="fas fa-chart-area"></i> ROC Curves <i class="fas fa-question-circle help-icon"
                            data-tooltip="Shows the model's accuracy. The closer the line is to the top-left corner, the more accurate the model is."></i>
                    </h3>
                    <canvas id="roc-chart"></canvas>
                </div>

                <!-- Feature Importance -->
                <div class="chart-card">
                    <h3><i class="fas fa-bars"></i> Feature Importance <i class="fas fa-question-circle help-icon"
                            data-tooltip="Lists the factors (like past price or volume) that the AI focuses on most when making a prediction."></i>
                    </h3>
                    <canvas id="feature-chart"></canvas>
                </div>

                <!-- Confusion Matrices -->
                <div class="chart-card">
                    <h3><i class="fas fa-th"></i> Confusion Matrix - LR <i class="fas fa-question-circle help-icon"
                            data-tooltip="Shows exactly where the model was right and where it made mistakes. Green bars are correct guesses."></i>
                    </h3>
                    <canvas id="cm-lr"></canvas>
                </div>

                <div class="chart-card">
                    <h3><i class="fas fa-th"></i> Confusion Matrix - RF <i class="fas fa-question-circle help-icon"
                            data-tooltip="Shows correct vs incorrect predictions for this model."></i></h3>
                    <canvas id="cm-rf"></canvas>
                </div>

                <div class="chart-card">
                    <h3><i class="fas fa-th"></i> Confusion Matrix - XGB <i class="fas fa-question-circle help-icon"
                            data-tooltip="Shows correct vs incorrect predictions for this model."></i></h3>
                    <canvas id="cm-xgb"></canvas>
                </div>

                <!-- Residual Plot -->
                <div class="chart-card">
                    <h3><i class="fas fa-scatter-chart"></i> Residual Plot <i class="fas fa-question-circle help-icon"
                            data-tooltip="Shows the prediction errors. Ideally, dots should be randomly scattered around the center line."></i>
                    </h3>
                    <canvas id="residual-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to set Ticker from URL -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ticker = urlParams.get('ticker') || 'Unknown';
        document.getElementById('ticker-name').textContent = ticker;
        document.getElementById('back-link').href = `index.html?ticker=${ticker}`;

        // Pass ticker to analytics.js via global var or meta
        window.currentTicker = ticker;
    </script>
    <script src="/js/analytics.js"></script>
</body>

</html>
